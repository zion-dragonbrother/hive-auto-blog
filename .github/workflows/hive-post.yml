name: Auto Hive Post
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      # 설치와 실행을 한 번에 진행하여 경로 문제 해결
      - name: Install and Run
        env:
          HIVE_POSTING_KEY: ${{ secrets.HIVE_POSTING_KEY }}
          HIVE_USER: ${{ secrets.HIVE_USER }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install beem
          python post_to_hive.py
