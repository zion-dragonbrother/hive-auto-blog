name: Auto Hive Post
on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev python3-dev libffi-dev
          pip install --upgrade pip
          pip install requests beem
      - name: Run script
        env:
          HIVE_POSTING_KEY: ${{ secrets.HIVE_POSTING_KEY }}
          HIVE_USER: ${{ secrets.HIVE_USER }}
        run: python post_to_hive.py
