name: Auto Hive Post
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install @hiveio/dhive
      - name: Run script
        env:
          HIVE_POSTING_KEY: ${{ secrets.HIVE_POSTING_KEY }}
          HIVE_USER: ${{ secrets.HIVE_USER }}
        run: node post_to_hive.js
