name: Auto Hive Post
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beem --no-cache-dir
      - name: Run script
        env:
          HIVE_POSTING_KEY: ${{ secrets.HIVE_POSTING_KEY }}
          HIVE_USER: ${{ secrets.HIVE_USER }}
        run: python post_to_hive.py
